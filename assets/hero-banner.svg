<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#171236"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c31" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0d1424" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.55"/>
    </pattern>

    <!-- Motion Paths for Proxy Tunnel Packets -->
    <path id="tunnelPathTop" d="M 690 220 C 755 220, 765 130, 835 130" fill="none"/>
    <path id="tunnelPathBot" d="M 690 220 C 755 220, 765 310, 835 310" fill="none"/>
  </defs>

  <style>
    .title { font: 800 40px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #f8fafc; letter-spacing: -0.8px; }
    .subtitle { font: 600 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #94a3b8; }
    .badge-txt { font: 700 12px 'Cascadia Code', Consolas, monospace; fill: #e2e8f0; }
    .card-title { font: 800 15px 'Segoe UI', sans-serif; fill: #f8fafc; }
    .card-sub { font: 600 11.5px 'Cascadia Code', Consolas, monospace; fill: #94a3b8; }
    .mono-sm { font: 600 11px 'Cascadia Code', Consolas, monospace; fill: #38bdf8; }
    .pulse-ring {
      transform-origin: 645px 220px;
      animation: pulseRing 3.2s ease-out infinite;
    }
    .pulse-ring-2 {
      transform-origin: 645px 220px;
      animation: pulseRing 3.2s ease-out 1.6s infinite;
    }
    .float-slow {
      animation: floatY 4.5s ease-in-out infinite;
    }
    .dash-flow {
      stroke-dasharray: 8 8;
      animation: dashMove 1.4s linear infinite;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.85); opacity: 0.75; }
      100% { transform: scale(1.65); opacity: 0; }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -32; }
    }
  </style>

  <!-- Main Background -->
  <rect width="1200" height="440" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="22" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="240" cy="220" r="240" fill="url(#glowCyan)">
    <animate attributeName="r" values="210;260;210" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="220" r="250" fill="url(#glowPurple)">
    <animate attributeName="r" values="230;280;230" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="1196" height="436" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.55"/>

  <!-- ================= LEFT HERO SECTION ================= -->
  <g class="float-slow">
    <!-- App Icon Squircle -->
    <rect x="58" y="64" width="96" height="96" rx="24" fill="#0d1426" stroke="url(#shieldGrad)" stroke-width="3"/>
    <!-- Shield + Globe Icon -->
    <path d="M106 80 L136 92 V116 C136 136 123 151 106 157 C89 151 76 136 76 116 V92 Z"
          fill="#38bdf8" fill-opacity="0.12" stroke="url(#shieldGrad)" stroke-width="5.5" stroke-linejoin="round"/>
    <circle cx="106" cy="116" r="17" fill="none" stroke="url(#shieldGrad)" stroke-width="4"/>
    <ellipse cx="106" cy="116" rx="8.5" ry="17" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <line x1="89" y1="116" x2="123" y2="116" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="106" cy="99" r="3.5" fill="#38bdf8"/>
    <circle cx="123" cy="116" r="3.5" fill="#a855f7"/>
    <circle cx="89" cy="116" r="3.5" fill="#38bdf8"/>
    <circle cx="106" cy="116" r="4" fill="#ffffff"/>
  </g>

  <!-- Version & Architecture Pill -->
  <rect x="172" y="72" width="236" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="188" cy="86" r="4.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="200" y="90" class="badge-txt" fill="#38bdf8">WINDOWS x64 &amp; ARM64 NATIVE</text>

  <!-- Title & Subtitle -->
  <text x="172" y="138" class="title">Free Proxy Browser</text>
  <text x="58" y="192" class="subtitle">Open-Source Anti-Detect &amp; Multi-Profile Proxy Browser Desktop Suite</text>
  <text x="58" y="218" class="subtitle" fill="#64748b">Dual C++ Engines (TaeBrowser Chromium 153 &amp; YangBrowser Gecko 153) · Auto Proxy Geo-Sync</text>

  <!-- Feature Pills Grid -->
  <g transform="translate(58, 248)">
    <rect x="0" y="0" width="238" height="44" rx="10" fill="url(#cardBg)" stroke="#24324f" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="5" fill="#38bdf8"/>
    <text x="36" y="19" class="card-title" style="font-size:12.5px">SOCKS5 / HTTP Tunneling</text>
    <text x="36" y="34" class="card-sub">1-Line Auth Parse &amp; Live GeoIP</text>

    <rect x="252" y="0" width="246" height="44" rx="10" fill="url(#cardBg)" stroke="#24324f" stroke-width="1.2"/>
    <circle cx="274" cy="22" r="5" fill="#a855f7"/>
    <text x="288" y="19" class="card-title" style="font-size:12.5px">GPU &amp; OpenGL / ANGLE</text>
    <text x="288" y="34" class="card-sub">D3D11 · OpenGL 4.6 · Metal · WebGPU</text>

    <rect x="0" y="56" width="238" height="44" rx="10" fill="url(#cardBg)" stroke="#24324f" stroke-width="1.2"/>
    <circle cx="22" cy="78" r="5" fill="#10b981"/>
    <text x="36" y="75" class="card-title" style="font-size:12.5px">Auto TZ · Lang · GPS Sync</text>
    <text x="36" y="90" class="card-sub">Follows Proxy Exit IP Country</text>

    <rect x="252" y="56" width="246" height="44" rx="10" fill="url(#cardBg)" stroke="#24324f" stroke-width="1.2"/>
    <circle cx="274" cy="78" r="5" fill="#f59e0b"/>
    <text x="288" y="75" class="card-title" style="font-size:12.5px">Live Hot-Reload &amp; Local API</text>
    <text x="288" y="90" class="card-sub">Port 50325 · Selenium &amp; Playwright</text>
  </g>

  <!-- Bottom Tech Bar -->
  <text x="58" y="392" class="mono-sm" fill="#64748b">
    ⚡ 100% Local SQLite · Zero Cloud Login · WebView2 Desktop GUI · SHA-1 x-browser-validation
  </text>

  <!-- ================= RIGHT MOTION DIAGRAM ================= -->
  <!-- Animated Connection Curves -->
  <path d="M 690 220 C 755 220, 765 130, 835 130" fill="none" stroke="#1e293b" stroke-width="4"/>
  <path d="M 690 220 C 755 220, 765 310, 835 310" fill="none" stroke="#1e293b" stroke-width="4"/>

  <path d="M 690 220 C 755 220, 765 130, 835 130" fill="none" stroke="#38bdf8" stroke-width="2.5" class="dash-flow"/>
  <path d="M 690 220 C 755 220, 765 310, 835 310" fill="none" stroke="#a855f7" stroke-width="2.5" class="dash-flow"/>

  <!-- Traveling Data Packets along Upper Path -->
  <circle r="5" fill="#38bdf8">
    <animateMotion dur="2.2s" repeatCount="indefinite">
      <mpath href="#tunnelPathTop"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#bae6fd">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite">
      <mpath href="#tunnelPathTop"/>
    </animateMotion>
  </circle>

  <!-- Traveling Data Packets along Lower Path -->
  <circle r="5" fill="#c084fc">
    <animateMotion dur="2.5s" repeatCount="indefinite">
      <mpath href="#tunnelPathBot"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#f3e8ff">
    <animateMotion dur="2.5s" begin="1.25s" repeatCount="indefinite">
      <mpath href="#tunnelPathBot"/>
    </animateMotion>
  </circle>

  <!-- Central Proxy Router Hub Node -->
  <circle cx="645" cy="220" r="46" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulse-ring"/>
  <circle cx="645" cy="220" r="46" fill="none" stroke="#a855f7" stroke-width="1.5" class="pulse-ring-2"/>
  <circle cx="645" cy="220" r="46" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="3"/>
  <text x="645" y="214" text-anchor="middle" class="card-title" style="font-size:12px;fill:#38bdf8">PROXY</text>
  <text x="645" y="230" text-anchor="middle" class="card-sub" style="font-size:10px;fill:#e2e8f0">GATEWAY</text>
  <text x="645" y="286" text-anchor="middle" class="card-sub" style="font-size:10.5px;fill:#34d399">Auto GeoIP / TZ</text>

  <!-- Card 1: TaeBrowser 153 (Chromium) -->
  <g transform="translate(835, 58)">
    <rect width="315" height="142" rx="14" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.75"/>
    <rect x="16" y="16" width="10" height="10" rx="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="34" y="26" class="card-title" fill="#38bdf8">TaeBrowser 153 (Chromium)</text>
    <rect x="234" y="12" width="66" height="20" rx="6" fill="#0c2d48"/>
    <text x="267" y="26" text-anchor="middle" class="mono-sm" style="font-size:10px">v153.0.8010</text>

    <text x="16" y="52" class="card-sub" fill="#cbd5e1">• Engine: <tspan fill="#38bdf8">TaeBrowser.exe</tspan> (C++ Policys)</text>
    <text x="16" y="72" class="card-sub" fill="#cbd5e1">• GPU: <tspan fill="#34d399">ANGLE D3D11 / OpenGL 4.6</tspan></text>
    <text x="16" y="92" class="card-sub" fill="#cbd5e1">• Stealth: <tspan fill="#fbbf24">x-browser-validation SHA-1</tspan></text>

    <!-- Animated Fingerprint Integrity Bar -->
    <rect x="16" y="110" width="283" height="14" rx="7" fill="#090d16" stroke="#1e293b"/>
    <rect x="18" y="112" width="240" height="10" rx="5" fill="url(#accentGrad)">
      <animate attributeName="width" values="195;279;195" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Card 2: YangBrowser 153 (Gecko) -->
  <g transform="translate(835, 240)">
    <rect width="315" height="142" rx="14" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.8" stroke-opacity="0.75"/>
    <rect x="16" y="16" width="10" height="10" rx="5" fill="#a855f7">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <text x="34" y="26" class="card-title" fill="#c084fc">YangBrowser 153 (Gecko)</text>
    <rect x="234" y="12" width="66" height="20" rx="6" fill="#2e1065"/>
    <text x="267" y="26" text-anchor="middle" class="mono-sm" style="font-size:10px;fill:#c084fc">v153.0.4</text>

    <text x="16" y="52" class="card-sub" fill="#cbd5e1">• Engine: <tspan fill="#c084fc">YangBrowser.exe</tspan> (xul.dll Hooks)</text>
    <text x="16" y="72" class="card-sub" fill="#cbd5e1">• Spoof: <tspan fill="#34d399">37 custom.* Native Overrides</tspan></text>
    <text x="16" y="92" class="card-sub" fill="#cbd5e1">• Reload: <tspan fill="#38bdf8">Live _webrtc Sidecar Polling</tspan></text>

    <!-- Animated Fingerprint Integrity Bar -->
    <rect x="16" y="110" width="283" height="14" rx="7" fill="#090d16" stroke="#1e293b"/>
    <rect x="18" y="112" width="260" height="10" rx="5" fill="url(#accentGrad)">
      <animate attributeName="width" values="279;205;279" dur="4.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
